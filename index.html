<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和弦節奏遊戲 (街機風格)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="arcade-cabinet">
        <header>
            <h1>⚡ 街機和弦節奏 ⚡</h1>
            <div class="score-board">
                分數: <span id="score">0</span> | 連擊: <span id="combo">0</span> | 時間: <span id="timeDisplay">60</span>s
            </div>
            <div id="chordDisplay" class="chord-display">準備就緒</div>
        </header>

        <div class="game-screen" id="gameScreen">
            <div id="hitFeedback" class="hit-feedback"></div>
            
            <!-- 控制按鈕列 -->
            <div class="game-top-bar">
                <button id="pauseBtn" class="control-small-btn" title="暫停 (ESC)">⏸ 暫停</button>
                <button id="restartBtn" class="control-small-btn" title="重新開始 (R)">🔄 重開</button>
            </div>

            <!-- 開始與設定遮罩 -->
            <div id="startOverlay" class="overlay">
                <div class="setup-box">
                    <label for="audioFile" class="file-label">🎵 選擇 MP3 歌曲</label>
                    <input type="file" id="audioFile" accept="audio/mp3, audio/wav, audio/ogg">
                    <div id="fileName" class="file-name">未選擇歌曲（預設隨機節奏）</div>
                    
                    <div class="bpm-control">
                        <label for="bpmInput">歌曲 BPM: </label>
                        <input type="number" id="bpmInput" value="120" min="60" max="240">
                    </div>

                    <!-- 新增：JSON 譜面匯入區 -->
                    <div class="chart-control">
                        <label for="chartFile" class="file-label chart-label">📂 匯入 JSON 譜面</label>
                        <input type="file" id="chartFile" accept=".json">
                        <div id="chartName" class="file-name">未匯入譜面（使用自動生成）</div>
                    </div>

                    <button id="startBtn">按此開始遊戲</button>
                </div>
            </div>

            <!-- 暫停遮罩 -->
            <div id="pauseOverlay" class="overlay" style="display: none;">
                <div class="setup-box">
                    <h2 class="overlay-title">遊戲暫停</h2>
                    <button id="resumeBtn" class="sub-btn">繼續遊戲</button>
                    <button id="restartFromPauseBtn" class="sub-btn">重新開始</button>
                </div>
            </div>

            <!-- 結算畫面遮罩 -->
            <div id="resultOverlay" class="overlay" style="display: none;">
                <div class="setup-box result-box">
                    <h2 class="overlay-title">🏆 演奏結束 🏆</h2>
                    <div class="result-rank" id="resultRank">S</div>
                    <div class="result-details">
                        <p>最終得分: <span id="finalScore" class="highlight">0</span></p>
                        <p>最高連擊: <span id="maxCombo" class="highlight">0</span> COMBO</p>
                    </div>
                    <button id="playAgainBtn" class="sub-btn">再玩一次</button>
                </div>
            </div>

            <div class="lane-container">
                <div class="lane" data-key="a" data-index="0">
                    <div class="lane-label">A</div>
                    <div class="hit-zone"></div>
                </div>
                <div class="lane" data-key="s" data-index="1">
                    <div class="lane-label">S</div>
                    <div class="hit-zone"></div>
                </div>
                <div class="lane" data-key="d" data-index="2">
                    <div class="lane-label">D</div>
                    <div class="hit-zone"></div>
                </div>
                <div class="lane" data-key="f" data-index="3">
                    <div class="lane-label">F</div>
                    <div class="hit-zone"></div>
                </div>
            </div>
        </div>

        <div class="controls-hint">
            鍵盤 <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> | <kbd>ESC</kbd> 暫停 <kbd>R</kbd> 重開
        </div>
    </div>

    <audio id="bgm"></audio>

    <script src="script.js"></script>
</body>
</html>
